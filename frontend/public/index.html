<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top right, #4f46e5, transparent 25%),
        radial-gradient(circle at bottom left, #9333ea, transparent 25%),
        linear-gradient(135deg, #0f172a, #1e1b4b);
      font-family: Inter, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(255,255,255,0.96);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }

    .header {
      padding: 35px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ececec;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 30px;
      font-weight: bold;
    }

    .brand h1 {
      color: #1e1b4b;
      font-size: 32px;
    }

    .brand p {
      margin-top: 5px;
      color: #7c83a3;
      font-size: 17px;
    }

    .status {
      background: #eef2ff;
      color: #4f46e5;
      padding: 12px 18px;
      border-radius: 15px;
      font-weight: 600;
    }

    .content {
      padding: 35px;
    }

    .top-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .card {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 25px;
      border-radius: 22px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-size: 40px;
    }

    .card span {
      opacity: 0.9;
      font-size: 16px;
    }

    .task-box {
      background: #f8f8ff;
      border-radius: 25px;
      padding: 30px;
    }

    .task-box h3 {
      color: #1e1b4b;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .input-area {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      height: 60px;
      border: 2px solid #ddd6fe;
      border-radius: 16px;
      padding: 0 20px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 0 28px;
      border-radius: 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }

    ul {
      list-style: none;
    }

    li {
      background: white;
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border: 1px solid #ececff;
      transition: 0.2s;
    }

    li:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.06);
    }

    .delete {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .footer {
      padding: 25px 35px;
      border-top: 1px solid #ececec;
      display: flex;
      justify-content: space-between;
      color: #7c83a3;
      font-size: 14px;
    }

    @media(max-width: 700px) {
      .header {
        flex-direction: column;
        gap: 20px;
      }

      .input-area {
        flex-direction: column;
      }

      button {
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="brand">
        <div class="logo">⚡</div>

        <div>
          <h1>Super App</h1>
          <p>Interactive Dashboard</p>
        </div>
      </div>

      <div class="status">
        Online
      </div>

    </div>

    <div class="content">

      <div class="top-panel">

        <div class="card">
          <span>Total Tasks</span>
          <h2 id="count">0</h2>
        </div>

        <div class="card">
          <span>Project</span>
          <h2>2026</h2>
        </div>

        <div class="card">
          <span>Status</span>
          <h2>Active</h2>
        </div>

      </div>

      <div class="task-box">

        <h3>Task Manager</h3>

        <div class="input-area">
          <input
            type="text"
            id="taskInput"
            placeholder="Add new task..."
          >

          <button id="addBtn">
            Add Task
          </button>
        </div>

        <ul id="taskList"></ul>

      </div>

    </div>

    <div class="footer">
      <span>Frontend Demo Project</span>
      <span id="date"></span>
    </div>

  </div>

  <script>
    const input = document.getElementById('taskInput');
    const btn = document.getElementById('addBtn');
    const list = document.getElementById('taskList');
    const count = document.getElementById('count');

    let tasks = [];

    function updateCount() {
      count.textContent = tasks.length;
    }

    function renderTasks() {
      list.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');

        li.innerHTML = `
          <span>${task}</span>

          <button class="delete" onclick="deleteTask(${index})">
            Delete
          </button>
        `;

        list.appendChild(li);
      });

      updateCount();
    }

    function addTask() {
      const text = input.value.trim();

      if (!text) return;

      tasks.push(text);

      input.value = '';

      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    btn.addEventListener('click', addTask);

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    document.getElementById('date').textContent =
      new Date().toLocaleDateString('ru-RU');

    renderTasks();
  </script>

</body>
</html>
